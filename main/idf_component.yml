## IDF Component Manager Manifest File
## 依赖由 idf.py 构建时自动从 components.espressif.com 拉取到 managed_components/
dependencies:
  idf: ">=5.2"
  ## LVGL 图形库（v9 内核）
  lvgl/lvgl: "^9.6.0"
  ## Espressif 官方 LVGL 移植层：负责 LVGL 与 esp_lcd 的对接（tick/任务/互斥锁）
  espressif/esp_lvgl_port: "^2.9.0"
  ## OV2640 摄像头驱动（DVP 并行接口 + SCCB 控制总线）
  espressif/esp32-camera: "^2.1.8"
  ## 乐鑫深度学习推理框架（含图像预处理/绘制工具；镜像最新 3.3.11）
  espressif/esp-dl: "^3.3.11"
  ## 人脸检测模型组件（默认 MSRMNP_S8_V1，输入 160x120 与大端 RGB565 直喂）
  espressif/human_face_detect: "^0.5.0"
